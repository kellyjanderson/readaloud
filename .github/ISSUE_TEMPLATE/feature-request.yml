name: Feature request
description: Propose a new capability or enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature.

        This issue can hold the working design; small fixes may remain one issue. Use native sub-issues only when slices are needed. Draft/fixed design revisions may live in project/interim under its lifecycle; live progress stays in GitHub. Visitor reports need no worker, model or worktree fields.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Related planning
      description: Link affected repository architecture and any parent issue. Include exclusions, migration and execution ownership when relevant.
      placeholder: Architecture URL, related issues, constraints and unresolved decisions
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this feature complete?
