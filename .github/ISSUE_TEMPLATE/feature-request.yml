name: Feature request
description: Propose a new capability or enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature.

        Architecture changes use an ACD and paired implementation plan; small changes may use this issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Related planning
      description: Link an active ACD/plan when available. Describe the problem before proposing implementation.
      placeholder: project/acd/... and project/planning/...
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this feature complete?
