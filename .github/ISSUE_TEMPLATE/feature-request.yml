name: Feature request
description: Propose a new capability or enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature.

        This issue is the working design authority. Use native sub-issues for implementation slices; do not create local planning files.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Related planning
      description: Link affected repository architecture and any parent issue. Include exclusions, migration and execution ownership when relevant.
      placeholder: Architecture URL, related issues, constraints and unresolved decisions
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this feature complete?
