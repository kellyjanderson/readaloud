name: Implementation slice
description: A bounded work order for an orchestrator or worker.
title: "[Slice]: "
labels: ["kind:slice"]
body:
  - type: textarea
    id: authority
    attributes:
      label: Parent and design revision
      description: Link the parent design and accepted decision revision. Add native parent/dependency relationships after creation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Objective and ownership
      description: Outcome, exclusions, owned files/modules, and overlap constraints.
    validations:
      required: true
  - type: textarea
    id: dispatch
    attributes:
      label: Current task
      description: Maintain this block at dispatch/handoff. Include exact model/effort and evidence links; follow docs/project-management.md. Move the block to the top after creation.
      value: |
        <!-- readaloud:current:start -->
        ## Current task
        Authority: parent and accepted revision link
        Owner: unassigned; no dispatch authorized by this template
        Delivery: base, branch/worktree and integration target pending
        Readiness / next action: orchestrator must verify native dependencies
        Execution: model/effort and exclusive paths/lane pending
        Acceptance / evidence: link checks, blockers and latest result
        <!-- readaloud:current:end -->
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and return contract
      description: Required checks and evidence; report result, paths, commit/PR, blockers and remaining work. FINAL must verify merged architecture and accepted feature evidence.
    validations:
      required: true
