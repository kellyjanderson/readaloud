name: Implementation slice
description: A bounded execution record for one directed owner or an authorized worker.
title: "[Slice]: "
labels: ["kind:slice"]
body:
  - type: textarea
    id: authority
    attributes:
      label: Authority and design revision
      description: Link the owning issue/accepted revision and parent when one exists. A small fix can use one issue; add native dependencies only when applicable.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Objective and ownership
      description: Outcome, exclusions, owned files/modules, and overlap constraints.
    validations:
      required: true
  - type: textarea
    id: dispatch
    attributes:
      label: Current task
      description: Maintain this block at meaningful handoff/decision changes; follow docs/project-management.md. Move it to the top after creation. Worker/model/worktree details are conditional on agent execution or delegation; actual base/target and evidence limits always remain.
      value: |
        <!-- readaloud:current:start -->
        ## Current task
        Authority: owning issue/revision; parent when applicable
        Owner: directed owner; delegated worker identity only when applicable
        Delivery: actual base commit, named branch and integration target; worktree if applicable
        Readiness / next action: verify applicable dependencies and scope
        Execution: agent model/effort when applicable; exclusive scope, delegated lane/worktree if used
        Acceptance / evidence: link checks, blockers and latest result
        <!-- readaloud:current:end -->
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and return contract
      description: Required checks and evidence; report result, paths, commit/PR, blockers and remaining work. FINAL must verify merged architecture and accepted feature evidence.
    validations:
      required: true
